[package]
name = "contrast"
version = "0.1.0"
edition = "2021"
authors = ["developer"]
description = "Minimalist OLED-optimized Neovim colorscheme"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "cache_bench"
harness = false
